name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'jarvis-android/**', '.github/workflows/build-apk.yml' ]

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jarvis-${{ hashFiles('jarvis-android/**/*.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: jarvis-android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: jarvis-android

      - name: Assemble release APK (self-signed publish build)
        run: ./gradlew --no-daemon assembleRelease
        working-directory: jarvis-android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: jarvis-android/app/build/outputs/apk/release/app-release-unsigned.apk
