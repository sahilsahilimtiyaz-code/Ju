name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Brahma-Ai-Evo-main/jarvis-android/**'
      - '.github/workflows/build-apk.yml'

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jarvis-${{ hashFiles('Brahma-Ai-Evo-main/jarvis-android/**/*.gradle.kts') }}

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: Brahma-Ai-Evo-main/jarvis-android

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: Brahma-Ai-Evo-main/jarvis-android

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease
        working-directory: Brahma-Ai-Evo-main/jarvis-android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: Brahma-Ai-Evo-main/jarvis-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: Brahma-Ai-Evo-main/jarvis-android/app/build/outputs/apk/release/app-release-unsigned.apk
